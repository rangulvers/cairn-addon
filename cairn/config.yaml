name: Cairn
version: "0.9.0-rc1"
slug: cairn
description: Haushalts-Inventar. Übernimmt Geräte direkt aus Home Assistant.
url: https://github.com/rangulvers/attic
arch:
  - amd64
  - aarch64
image: ghcr.io/rangulvers/cairn-{arch}
init: false
ingress: true
ingress_port: 8000
panel_icon: mdi:archive-outline
panel_title: Cairn
# Both are needed for SUPERVISOR_TOKEN to reach http://supervisor/core, which
# is how the device import works without a long-lived token.
hassio_api: true
homeassistant_api: true
options:
  log_level: info
schema:
  log_level: list(trace|debug|info|warning|error)?
